services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/var/www/html
      - ./docker/php/xdebug.ini:/usr/local/etc/php/conf.d/docker-php-ext-xdebug.ini
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=laravel
      - DB_USERNAME=postgres
      - DB_PASSWORD=secret
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - laravel-network

  nginx:
    image: nginx:latest
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - laravel-network

  db:
    image: postgres:15
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: laravel
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - laravel-network


  pgadmin:
    image: dpage/pgadmin4
    ports:
      - '5050:80'
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@test.ru
      PGADMIN_DEFAULT_PASSWORD: root
    depends_on:
      - db
    networks:
      - laravel-network

  redis:
    image: redis:alpine
    ports:
        - "6379:6379"
    volumes:
        - redis-data:/data
    networks:
        - laravel-network
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:

networks:
  laravel-network:
    driver: bridge
